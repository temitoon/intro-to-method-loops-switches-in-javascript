<h2>Methods and Loops</h2>
<p>Numbers from 1 to 10</p>
<p id="numbers"></p>
<p id="random"></p>
<p id="day"></p>

<script>

    let text = "";
    for (let i = 1; i <= 10; i++) {
        text += i + "<br>";
    }
    document.getElementById("numbers").innerHTML = text;

    
    let randomNumber = Math.floor(Math.random() * 100);
    document.getElementById("random").innerText = "The random number is " + randomNumber;


    let dayNumber = new Date().getDay();
    document.getElementById("day").innerText = "Today's day number is " + dayNumber;
</script>
